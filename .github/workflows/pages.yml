name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build marketing site
        run: |
          cd web-site
          npm ci
          npm run build

      - name: Generate docs CLI reference and RBAC matrix
        run: make docs-cli

      - name: Build docs site
        run: make docs-build

      - name: Merge docs into the marketing site's Pages artifact
        run: |
          mkdir -p web-site/dist/vessel
          cp -r docs/dist/. web-site/dist/vessel/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
