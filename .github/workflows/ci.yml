name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build
        run: make build

      - name: test
        run: make test

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  docs-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: docs-cli is up to date
        run: |
          make docs-cli
          git diff --exit-code -- docs/src/content/docs/cli-reference.mdx docs/src/content/docs/configuration.mdx docs/src/content/docs/authentication-and-roles.mdx

      - name: docs-verify (webhook signature snippets)
        run: make docs-verify

      - name: docs-build
        run: make docs-build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web build
        run: cd web && npm ci && npm run build

      - name: pull test image
        run: docker pull alpine:3

      - name: e2e smoke (container lifecycle + webhook delivery, SPEC §12/§14)
        run: go test -tags e2e -v ./e2e/...
