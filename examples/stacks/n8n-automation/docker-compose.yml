services:
  web:
    image: n8nio/n8n:1.56.2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?a database password is required}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=cache
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY:?an encryption key is required}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - back
    depends_on:
      - db
      - cache
    labels:
      com.vessel.example: n8n-automation

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?a database password is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - back
    labels:
      com.vessel.example: n8n-automation

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy noeviction
    volumes:
      - cache_data:/data
    networks:
      - back
    labels:
      com.vessel.example: n8n-automation

networks:
  back:
    driver: bridge

volumes:
  n8n_data:
    driver: local
  db_data:
    driver: local
  cache_data:
    driver: local
