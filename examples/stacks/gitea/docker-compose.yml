services:
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3300}:3000"
      - "${SSH_PORT:-2222}:22"
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB:-gitea}
      - GITEA__database__USER=${POSTGRES_USER:-gitea}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:?a database password is required}
      - GITEA__server__ROOT_URL=${ROOT_URL:-http://localhost:3300/}
      - GITEA__mailer__ENABLED=${MAILER_ENABLED:-false}
      - GITEA__cache__ENABLED=true
      - GITEA__cache__ADAPTER=redis
      - GITEA__cache__HOST=redis://cache:6379/0
    volumes:
      - gitea_data:/data
    networks:
      - back
    depends_on:
      - db
      - cache
    labels:
      com.vessel.example: gitea

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy allkeys-lru
    volumes:
      - cache_data:/data
    networks:
      - back
    labels:
      com.vessel.example: gitea

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gitea}
      - POSTGRES_USER=${POSTGRES_USER:-gitea}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?a database password is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - back
    labels:
      com.vessel.example: gitea

networks:
  back:
    driver: bridge

volumes:
  gitea_data:
    driver: local
  db_data:
    driver: local
  cache_data:
    driver: local
